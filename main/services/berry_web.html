<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab5 · Berry</title>
<!-- O editor com cores e do navegador: CodeMirror do CDN. Sem internet no PC,
     fica a caixa de texto simples (o resto funciona igual). -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<style>
:root { --fundo:#14161c; --painel:#1c1f27; --linha:#2a2e38; --texto:#dfe3ea; --apagado:#8a91a0;
        --azul:#64b4ff; --verde:#a6e22e; --laranja:#ff9f43; --erro:#ff5c5c; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; background:var(--fundo); color:var(--texto);
             font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#tudo { display:flex; height:100%; }
#lado { width:240px; flex:none; background:var(--painel); border-right:1px solid var(--linha);
        display:flex; flex-direction:column; }
#lado h1 { font-size:15px; margin:0; padding:14px 14px 10px; color:var(--apagado); font-weight:600; }
#lista { flex:1; overflow:auto; list-style:none; margin:0; padding:0 6px; }
#lista li { padding:7px 10px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
#lista li:hover { background:var(--linha); }
#lista li.atual { background:#28344a; color:#fff; }
#lista li small { color:var(--apagado); }
#lado .rodape { padding:10px; border-top:1px solid var(--linha); display:flex; gap:6px; }
#principal { flex:1; display:flex; flex-direction:column; min-width:0; }
#barra { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--linha); }
#arq { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
button { font:inherit; border:0; border-radius:6px; padding:7px 14px; cursor:pointer; background:#3a3f4c; color:#fff; }
button:hover { filter:brightness(1.15); }
button:disabled { opacity:.45; cursor:default; filter:none; }
button.verificar { background:#2c5d8a; }
button.rodar { background:#5f8a1e; }
#msg { padding:6px 12px; min-height:32px; border-bottom:1px solid var(--linha); color:var(--verde); white-space:pre-wrap; }
#msg.erro { color:var(--laranja); }
#area { flex:1; position:relative; min-height:0; }
#area textarea { width:100%; height:100%; border:0; resize:none; outline:none; padding:8px 12px;
                 background:var(--fundo); color:var(--texto); font:14px/1.45 ui-monospace, Menlo, Consolas, monospace; tab-size:2; }
.CodeMirror { height:100%; background:var(--fundo); color:var(--texto); font:14px/1.45 ui-monospace, Menlo, Consolas, monospace; }
.CodeMirror-gutters { background:var(--painel); border-right:1px solid var(--linha); }
.CodeMirror-linenumber { color:#5c6370; }
.CodeMirror-cursor { border-left:2px solid #fff; }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background:#2f3d55; }
.cm-keyword { color:var(--azul); } .cm-atom { color:#c792ea; } .cm-number { color:#f78c6c; }
.cm-string { color:#c3e88d; } .cm-comment { color:#6a7385; font-style:italic; }
.cm-builtin { color:var(--laranja); } .cm-def { color:#82aaff; }
.linha-erro { background:rgba(255,92,92,.18); }
#vazio { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--apagado); }
@media (max-width:640px) { #tudo { flex-direction:column; } #lado { width:auto; height:30%; border-right:0; border-bottom:1px solid var(--linha); } }
</style>
</head>
<body>
<div id="tudo">
  <aside id="lado">
    <h1>Scripts · apps/Berry</h1>
    <ul id="lista"></ul>
    <div class="rodape">
      <button id="novo">+ Novo</button>
      <button id="reler" title="Ler a lista de novo">Atualizar</button>
    </div>
  </aside>
  <main id="principal">
    <div id="barra">
      <span id="arq">—</span>
      <button id="salvar" title="Ctrl+S" disabled>Salvar</button>
      <button id="verificar" class="verificar" title="Compila sem rodar" disabled>Verificar</button>
      <button id="rodar" class="rodar" title="Ctrl+Enter: salva, verifica e abre no Tab5" disabled>Rodar</button>
    </div>
    <div id="msg"></div>
    <div id="area"><textarea id="texto" spellcheck="false" hidden></textarea><div id="vazio">Escolha um script à esquerda, ou + Novo</div></div>
  </main>
</div>
<script>
"use strict";
const LIMITE = 32766;   // BERRY_SCRIPT_MAX - 1: o editor do aparelho nao abre maior
const $ = (id) => document.getElementById(id);
let atual = null, mudou = false, linhaErro = -1, ed = null, relogio = null, gravando = false;
// GRAVACAO AUTOMATICA: 2 s depois da ultima tecla. O Tab5 desliga o servidor
// depois de um tempo sem pedido nenhum - quando isso acontece, o que foi
// feito ja esta no cartao.
const AUTO_MS = 2000;

// ---- o editor: CodeMirror com as cores do Berry, ou a caixa de texto -------
if (window.CodeMirror && CodeMirror.defineSimpleMode) {
  CodeMirror.defineSimpleMode("berry", {
    start: [
      { regex: /"(?:[^\\"]|\\.)*?(?:"|$)/, token: "string" },
      { regex: /'(?:[^\\']|\\.)*?(?:'|$)/, token: "string" },
      { regex: /#-/, token: "comment", next: "bloco" },
      { regex: /#.*/, token: "comment" },
      { regex: /(?:def|if|while|for|class|do|try)\b/, token: "keyword", indent: true },
      { regex: /(?:elif|else|except)\b/, token: "keyword", dedent: true, indent: true },
      { regex: /end\b/, token: "keyword", dedent: true },
      { regex: /(?:return|break|continue|var|static|import|as|raise)\b/, token: "keyword" },
      { regex: /(?:true|false|nil|self|super)\b/, token: "atom" },
      { regex: /0x[0-9a-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/, token: "number" },
      { regex: /(?:tela|sistema|teclado|cartao|espnow|mesh|camera|gnss|musica)\b/, token: "builtin" },
      { regex: /[A-Za-z_]\w*/, token: "variable" },
    ],
    bloco: [ { regex: /.*?-#/, token: "comment", next: "start" }, { regex: /.*/, token: "comment" } ],
    meta: { lineComment: "#", electricInput: /^\s*(?:end|else|elif|except)$/ },
  });
  ed = CodeMirror($("area"), { mode: "berry", lineNumbers: true, indentUnit: 2, tabSize: 2,
                               indentWithTabs: false, readOnly: "nocursor",
                               extraKeys: { Tab: (c) => c.execCommand(c.somethingSelected() ? "indentMore" : "insertSoftTab") } });
  ed.on("change", () => marcarMudou());
} else {
  $("texto").addEventListener("input", () => marcarMudou());
}
const txt = {
  pegar: () => ed ? ed.getValue() : $("texto").value,
  por(v) {
    if (ed) { ed.setValue(v); ed.setOption("readOnly", false); ed.clearHistory(); ed.focus(); }
    else { const t = $("texto"); t.hidden = false; t.value = v; t.focus(); }
    $("vazio").hidden = true;
  },
  erro(n) {   // n = linha (1 = a primeira); 0 = limpar
    if (ed) {
      if (linhaErro >= 0) { ed.removeLineClass(linhaErro, "background", "linha-erro"); }
      linhaErro = -1;
      if (n > 0 && n <= ed.lineCount()) {
        linhaErro = n - 1;
        ed.addLineClass(linhaErro, "background", "linha-erro");
        ed.setCursor({ line: linhaErro, ch: 0 });
        ed.scrollIntoView({ line: linhaErro, ch: 0 }, 80);
      }
    } else if (n > 0) {
      const t = $("texto"), l = t.value.split("\n");
      const ini = l.slice(0, n - 1).join("\n").length + (n > 1 ? 1 : 0);
      t.focus(); t.setSelectionRange(ini, ini + (l[n - 1] || "").length);
    }
  },
};

function mensagem(t, erro) { const m = $("msg"); m.textContent = t; m.className = erro ? "erro" : ""; }
function marcarMudou() {
  if (!atual) return;
  mudou = true; $("arq").textContent = atual + "  •";
  clearTimeout(relogio);
  relogio = setTimeout(() => { if (mudou) salvar(true); }, AUTO_MS);
}
function botoes(sim) { for (const b of ["salvar", "verificar", "rodar"]) $(b).disabled = !sim; }
const bytes = (s) => new TextEncoder().encode(s).length;

// Todo pedido que muda algo leva o X-Tab5 (o servidor recusa sem ele).
async function pedir(metodo, url, corpo, ficar) {
  const r = await fetch(url, { method: metodo, body: corpo, cache: "no-store", keepalive: !!ficar,
                               headers: metodo === "GET" ? {} : { "X-Tab5": "1", "Content-Type": "text/plain; charset=utf-8" } });
  if (r.status === 413) throw new Error(await r.text());
  if (r.status === 503 || r.status === 403) throw new Error("o servidor do Tab5 foi desligado (" + (await r.text()) + ")");
  if (!r.ok) throw new Error(await r.text() || ("erro " + r.status));
  return r;
}
const q = (arq) => "?arq=" + encodeURIComponent(arq);

async function listar() {
  try {
    const l = await (await pedir("GET", "api/scripts")).json();
    const ul = $("lista");
    ul.innerHTML = "";
    for (const s of l) {
      const li = document.createElement("li");
      li.innerHTML = "<span></span><small></small>";
      li.firstChild.textContent = s.nome;
      li.lastChild.textContent = s.bytes < 1024 ? s.bytes + " B" : (s.bytes / 1024).toFixed(1) + " KB";
      if (s.nome === atual) li.className = "atual";
      li.onclick = () => abrir(s.nome);
      ul.appendChild(li);
    }
    if (!l.length) ul.innerHTML = "<li><small>nenhum script ainda</small></li>";
    return l;
  } catch (e) { mensagem(e.message, true); return []; }
}

// Trocar de script: grava o atual antes (nao pergunta - salvar e o padrao).
async function largar() { return !mudou || await salvar(true) || confirm("Não salvou " + atual + ". Descartar as mudanças?"); }

async function abrir(nome) {
  if (nome === atual || !(await largar())) return;
  try {
    const t = await (await pedir("GET", "api/script" + q(nome))).text();
    atual = nome; txt.por(t); mudou = false; txt.erro(0);
    $("arq").textContent = nome; botoes(true); mensagem("");
    listar();
  } catch (e) { mensagem(e.message, true); }
}

function grande() {
  const n = bytes(txt.pegar());
  if (n <= LIMITE) return false;
  mensagem("O script tem " + n + " bytes; o limite é " + LIMITE + " (o editor do Tab5 não abriria).", true);
  return true;
}

// auto = a gravacao automatica (nao rele a pasta no Tab5, nao mexe na lista).
async function salvar(auto, ficar) {
  if (!atual || grande() || gravando) return false;
  clearTimeout(relogio);
  const texto = txt.pegar(), arq = atual;
  gravando = true;
  try {
    const r = await (await pedir("POST", "api/script" + q(arq) + (auto === true ? "&auto=1" : ""), texto, ficar)).json();
    if (!r.ok) { mensagem(r.erro, true); return false; }
    // So limpa o "mudou" se ninguem digitou enquanto gravava.
    if (arq === atual && texto === txt.pegar()) { mudou = false; $("arq").textContent = atual; }
    else if (mudou) { relogio = setTimeout(() => salvar(true), AUTO_MS); }
    mensagem(auto === true ? "salvo automaticamente " + new Date().toLocaleTimeString() : "salvo");
    if (auto !== true) listar();
    return true;
  } catch (e) { mensagem(e.message, true); return false; }
  finally { gravando = false; }
}

function mostrar(r, pronto) {
  txt.erro(r.ok ? 0 : r.linha);
  if (r.ok) mensagem(pronto);
  else mensagem((r.linha > 0 ? "linha " + r.linha + ": " : "") + r.erro, true);
}

async function verificar() {
  if (!atual) return;
  try { mostrar(await (await pedir("POST", "api/verificar", txt.pegar())).json(), "verificado: sem erros de sintaxe"); }
  catch (e) { mensagem(e.message, true); }
}

async function rodar() {
  if (!atual || grande()) return;
  clearTimeout(relogio);
  try {
    const r = await (await pedir("POST", "api/rodar" + q(atual), txt.pegar())).json();
    mudou = false; $("arq").textContent = atual;
    mostrar(r, r.aberto ? "salvo e aberto no Tab5" : "salvo - o app novo aparece na tela inicial do Tab5 (toque nele para rodar)");
    listar();
  } catch (e) { mensagem(e.message, true); }
}

const MODELO = (nome) =>
`# nome: ${nome}
# cor: 0x07FF
#
# O que fica fora das funcoes roda uma vez, ao abrir.
# Funcoes: docs/BERRY_API.md

var toques = 0

def desenhar(tudo)
  tela.texto("Ola!", 40, 40, 40)
  tela.texto("toques: " + str(toques), 40, 120)
end

def tocar(x, y)
  toques += 1
  sistema.redesenhar()
end
`;

async function novo() {
  if (!(await largar())) return;
  let nome = prompt("Nome do script (sem .be):", "novo");
  if (!nome) return;
  nome = nome.trim().replace(/\.be$/i, "");
  if (!/^[A-Za-z0-9 _.-]+$/.test(nome) || nome.startsWith(".")) { mensagem("Use letras sem acento, números, espaço, _ ou -.", true); return; }
  const arq = nome + ".be";
  const l = await listar();
  if (l.some((s) => s.nome.toLowerCase() === arq.toLowerCase())) { mensagem(arq + " já existe.", true); return; }
  atual = arq; txt.por(MODELO(nome)); txt.erro(0); botoes(true);
  mudou = true; $("arq").textContent = arq + "  •";
  await salvar();
}

$("salvar").onclick = () => salvar();
$("verificar").onclick = verificar;
$("rodar").onclick = rodar;
$("novo").onclick = novo;
$("reler").onclick = listar;
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key === "s") { e.preventDefault(); salvar(); }
  else if (e.key === "Enter") { e.preventDefault(); rodar(); }
});
// Saiu da aba ou vai fechar: grava ja (keepalive: o pedido termina mesmo com a pagina indo embora).
document.addEventListener("visibilitychange", () => { if (document.hidden && mudou) salvar(true, true); });
window.addEventListener("beforeunload", (e) => {
  if (!mudou) return;
  salvar(true, true);
  e.preventDefault(); e.returnValue = "";
});
if (!ed) mensagem("Sem internet no PC: o editor com cores não carregou, a caixa de texto simples funciona igual.", true);
listar();
</script>
</body>
</html>
